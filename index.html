<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM_SHOP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #ffffff; padding: 15px; }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 24px; margin: 0; }
        .header img { width: 40px; height: 40px; object-fit: contain; }

        /* Кнопки каталогов */
        .catalog-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .catalog-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #2ecc71;
            border-radius: 10px;
            background: white;
            color: #2ecc71;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .catalog-btn.active {
            background: #2ecc71;
            color: white;
        }

        /* Сетка товаров */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #eee; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 150px; object-fit: cover; display: block; }
        .product-info { padding: 10px; }
        .product-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .product-price { color: #2ecc71; font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .buy-btn { background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
        .buy-btn:active { background: #27ae60; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <h1>SAM_SHOP</h1>
        <img src="images/samlog.png" alt="SAM">
    </div>

    <!-- Кнопки каталогов -->
    <div class="catalog-buttons">
        <button class="catalog-btn active" data-catalog="compressors">Компрессора</button>
        <button class="catalog-btn" data-catalog="plates">Пластины</button>
    </div>

    <!-- Сетка товаров -->
    <div class="products-grid" id="products-container"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Все товары с категориями
        const products = [
            // === КОМПРЕССОРА ===
            { id: 1, name: "Управляющий клапан компресора кондиционера k2", price: 900, category: "compressors", image: "images/к1.jpg" },
            { id: 2, name: "Управляющий клапан компресора кондиционера k2", price: 820, category: "compressors", image: "images/к2.jpg" },
            { id: 3, name: "Управляющий клапан компресора кондиционера k2", price: 700, category: "compressors", image: "images/к3.jpg" },
            { id: 4, name: "Управляющий клапан компресора кондиционера k2", price: 800, category: "compressors", image: "images/к4.jpg" },

            // === ПЛАСТИНЫ ===
            { id: 5, name: "VSTSU065", price: 900, category: "plates", image: "images/p1.jpg" },
            { id: 6, name: "VSTSU041", price: 5500, category: "plates", image: "images/p2.jpg" },
            { id: 7, name: "VSTSU061504005418", price: 900, category: "plates", image: "images/p3.jpg" },
            { id: 8, name: "VSTSU0171618494", price: 900, category: "plates", image: "images/p4.jpg" }
            // Добавь остальные товары
        ];

        const container = document.getElementById('products-container');
        const buttons = document.querySelectorAll('.catalog-btn');

        let currentCatalog = 'compressors'; // По умолчанию показываем компрессора

        // Функция отрисовки товаров
        function renderProducts(catalog) {
            container.innerHTML = '';
            const filtered = products.filter(p => p.category === catalog);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price.toLocaleString()} ₽</div>
                        <button class="buy-btn" data-name="${product.name}" data-price="${product.price}">Купить</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Переключение каталогов
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCatalog = btn.dataset.catalog;
                renderProducts(currentCatalog);
            });
        });

        // Первая загрузка
        renderProducts(currentCatalog);

        // Клик по кнопке «Купить»
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('buy-btn')) {
                const name = e.target.dataset.name;
                const price = e.target.dataset.price;
                tg.sendData(JSON.stringify({ action: 'buy', item_name: name, price: Number(price) }));
                tg.close();
            }
        });
    </script>
</body>
</html>
